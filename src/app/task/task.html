<h2>Tasks</h2>

<div *ngIf="loading">Loading tasks...</div>

<div *ngIf="error" style="color: red;">
  {{ error }}
</div>

<ul *ngIf="!loading && tasks.length" style="padding-left: 20px;">
  <li *ngFor="let task of tasks" style="margin-bottom: 8px;">
    <span [style.textDecoration]="task.isCompleted ? 'line-through' : 'none'">
      {{ task.title }}
    </span>
  </li>
</ul>

<p *ngIf="!loading && !tasks.length">
  No tasks found.
</p>
