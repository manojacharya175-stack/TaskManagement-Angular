<h2>Login</h2>

<form (ngSubmit)="onSubmit()">
  <div>
    <label>Email</label><br />
    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter email"
      required
    />
  </div>

  <br />

  <div>
    <label>Password</label><br />
    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter password"
      required
    />
  </div>

  <br />

  <button type="submit">Login</button>
</form>
